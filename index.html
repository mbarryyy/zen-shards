<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#d4dde6" />
  <title>Zen Shards</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

  <style>
    /* ╔═══════════════════════════════════════════════════════════════════╗
       ║ TUNE: visual "feel" knobs in this file.                          ║
       ║                                                                  ║
       ║ Background brightness:    --bg-deep      (darker = moodier)      ║
       ║ HUD pill background:      --bg-panel     (alpha = panel opacity) ║
       ║ HUD border softness:      --border-soft  (alpha = how visible)   ║
       ║ Accent text brightness:   --accent-text  (lighter = more pop)    ║
       ║                                                                  ║
       ║ Breath pulse rhythm (the slow ambient screen-edge glow):         ║
       ║   --breath-period   slower = calmer (4.5s = matches calm exhale) ║
       ║   #breath-ambient { background: ... 0.07 ... 0.12 } the alphas   ║
       ║   control how visible the pulse is (lower = more subtle).        ║
       ║                                                                  ║
       ║ Wrong-click vignette intensity: --wrong-vignette (alpha)         ║
       ║ Correct-flash halo color:       --correct-flash (alpha)          ║
       ║ (these are consumed by future Phase 6 effects)                   ║
       ║                                                                  ║
       ║ Don't change without pairing JS tokens:                          ║
       ║   --ball-primary / --ball-split-l1 / --ball-split-l2 must match  ║
       ║   the KIND_COLOR map in src/ball.js — change both or neither.    ║
       ╚══════════════════════════════════════════════════════════════════╝

       Zen Shards · Design Tokens
       Locked palette per spec — do not introduce new colors.
    */
    :root {
      /* Core background — soft low-saturation light-blue gradient */
      --bg-top:    #e6ecf2;
      --bg-bottom: #c2d2e0;
      --bg-deep:   #d4dde6;            /* fallback / Three.js scene tint */
      --bg-panel: rgba(255, 255, 255, 0.55);
      --bg-panel-strong: rgba(245, 248, 252, 0.92);

      /* Glass ball palette — kept in sync with ball.js KIND_COLOR.
         Phase 8 cool-blue family: orbs live in the same tonal world as
         the gradient bg so they whisper instead of shouting. */
      --ball-primary: #dde4ec;     /* warm pearl with blue undertone */
      --ball-split-l1: #9fb5cc;    /* smoke blue */
      --ball-split-l2: #5e7a96;    /* deep lake blue */
      --ball-split: var(--ball-split-l1);

      /* HUD borders + accents — flipped to dark-on-light */
      --border-soft: rgba(120, 140, 160, 0.30);
      --border-strong: rgba(90, 110, 130, 0.45);
      --accent-text: #2a3848;
      --accent-bright: #1f5fa8;
      --accent-dim: rgba(50, 70, 90, 0.65);
      --accent-faint: rgba(50, 70, 90, 0.50);
      --accent-whisper: rgba(50, 70, 90, 0.35);

      /* Feedback */
      --correct-flash: rgba(120, 200, 140, 0.32);
      --wrong-vignette: rgba(220, 90, 80, 0.38);

      /* Motion */
      --ease-out-zen: cubic-bezier(0.22, 0.61, 0.36, 1);
      --ease-in-zen:  cubic-bezier(0.55, 0.06, 0.68, 0.19);
      --breath-period: 4.5s;

      /* Layout — single source of truth for top-nav height so HUD pills,
         page padding, and scroll containers all clear the nav uniformly.
         Mobile media-queries below override this with safe-area-aware
         values so pills never sit under a notch. */
      --nav-h: 56px;
    }

    /* ──────────────────────────────────────────────────────────
       Reset + base
       ────────────────────────────────────────────────────────── */
    * { margin: 0; padding: 0; outline: none !important; box-sizing: border-box; }
    html, body, #root, #app, .page-container {
      width: 100%; height: 100%; overflow: hidden;
    }
    /* Mobile/touch baseline — kill the iOS gray tap flash and the 300ms
       double-tap zoom delay on every interactive surface. Adding here
       (rather than per-component) guarantees no element gets missed when
       new buttons/links are introduced later. */
    button, a, [role="button"], input, [tabindex] {
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }
    html, body {
      background:
        radial-gradient(ellipse at 50% 0%, #eef3f8 0%, transparent 60%),
        linear-gradient(180deg, var(--bg-top) 0%, var(--bg-bottom) 100%);
      background-attachment: fixed;
    }
    #root, #app, .page-container { background: transparent; }
    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      color: #2a3848;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      text-rendering: optimizeLegibility;
      overflow-x: hidden; /* mobile safety — sub-pixel transform overflow */
    }
    canvas { display: block; outline: none !important; }

    /* Focus indicators — visible but soft, never harsh outlines */
    button:focus-visible,
    [role="button"]:focus-visible,
    [tabindex]:focus-visible {
      box-shadow: 0 0 0 2px var(--accent-bright), 0 0 14px rgba(31, 95, 168, 0.30);
      transition: box-shadow 0.15s var(--ease-out-zen);
    }

    /* ──────────────────────────────────────────────────────────
       Ambient breath pulse — soft inward green glow on screen
       edges, syncing the player's breathing to the game's rhythm.
       Sits behind the canvas? No — above, but pointer-events:none
       so it never steals clicks.
       ────────────────────────────────────────────────────────── */
    #breath-ambient {
      position: fixed; inset: 0;
      pointer-events: none;
      z-index: 2;
      background: radial-gradient(
        ellipse at center,
        transparent 55%,
        rgba(180, 200, 220, 0.10) 92%,
        rgba(160, 185, 210, 0.16) 100%
      );
      opacity: 0;
      animation: breath-pulse var(--breath-period) ease-in-out infinite;
      mix-blend-mode: multiply;
    }
    @keyframes breath-pulse {
      0%, 100% { opacity: 0.0; }
      45%      { opacity: 1.0; }
      55%      { opacity: 1.0; }
    }
    /* Wrong-click cue: pause the breath briefly so the player feels the
       rhythm was interrupted. Feedback module toggles this class. */
    #breath-ambient.breath-disrupted {
      animation-play-state: paused;
      opacity: 0;
      transition: opacity 0.2s var(--ease-out-zen);
    }

    /* ──────────────────────────────────────────────────────────
       UI overlay shell
       Phase 5 HUD (structure + minimal styling). Phase 6 polish-pass
       (ui-3d-designer) will refine motion + composition.
       ────────────────────────────────────────────────────────── */
    #ui {
      position: fixed; inset: 0;
      pointer-events: none;
      z-index: 10;
      user-select: none;
    }
    #ui > * { pointer-events: auto; }
    #ui .non-interactive { pointer-events: none; }

    /* Top-centre pills row.
       `top` references --nav-h (defined on :root) so the pills always
       clear the top-bar nav, including its safe-area-inset on notched
       phones. Mobile breakpoints below recompute --nav-h and tighten
       this offset. */
    .hud-top {
      position: fixed; top: calc(var(--nav-h) + 24px); left: 50%;
      transform: translateX(-50%);
      display: flex; gap: 12px;
      pointer-events: none;
    }
    .hud-pill {
      display: flex; align-items: baseline; gap: 8px;
      padding: 8px 16px;
      background: var(--bg-panel);
      border: 1px solid var(--border-soft);
      border-radius: 999px;
      font-size: 13px;
      letter-spacing: 0.04em;
      color: var(--accent-dim);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      white-space: nowrap; /* labels never wrap when squeezed on narrow widths */
    }
    .hud-pill__label {
      text-transform: uppercase;
      font-size: 10px;
      letter-spacing: 0.18em;
      color: var(--accent-faint);
    }
    .hud-pill__value {
      font-weight: 600; color: var(--accent-text);
      font-variant-numeric: tabular-nums;
      min-width: 1.25em; /* prevent neighbor reflow when value pulses + width changes (e.g. 9 → 10) */
      text-align: right;
    }

    /* Phase hint — cross-fades on text change via .hud-hint--out */
    .hud-hint {
      position: fixed; top: calc(var(--nav-h) + 72px); left: 50%;
      transform: translateX(-50%);
      font-size: 11px; letter-spacing: 0.32em;
      text-transform: uppercase;
      color: var(--accent-whisper);
      pointer-events: none;
      opacity: 1;
      transition: opacity 0.32s var(--ease-out-zen);
    }
    .hud-hint--out { opacity: 0; }

    /* ──────────────────────────────────────────────────────────
       Lives indicator — three bare dots, centred below the phase hint.
       No pill/background/border — just dots floating against the bg.
       Remaining = solid white. Lost = hollow white outline. The dot
       being consumed flashes red during its transition.
       ────────────────────────────────────────────────────────── */
    .hud-lives {
      position: fixed; top: calc(var(--nav-h) + 102px); left: 50%;
      transform: translateX(-50%);
      display: flex; gap: 12px; align-items: center;
      pointer-events: none;
      background: none; border: none; padding: 0;
    }
    .hud-lives__dot {
      width: 10px; height: 10px;
      border-radius: 50%;
      background: #ffffff;
      box-shadow: 0 0 6px rgba(255, 255, 255, 0.60);
      transition: background 0.4s var(--ease-out-zen),
                  box-shadow 0.4s var(--ease-out-zen),
                  transform 0.4s var(--ease-out-zen),
                  opacity 0.4s var(--ease-out-zen);
    }
    .hud-lives__dot.lost {
      background: transparent;
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.55);
      transform: scale(0.85);
      opacity: 0.65;
    }
    /* One-shot red pulse fired on the dot transitioning full → lost */
    .hud-lives__dot.losing {
      animation: hud-life-lose 0.55s var(--ease-out-zen);
    }
    @keyframes hud-life-lose {
      0%   { background: #ffffff; transform: scale(1);
             box-shadow: 0 0 6px rgba(255, 255, 255, 0.60); }
      30%  { background: #e85a5f; transform: scale(1.55);
             box-shadow: 0 0 22px rgba(232, 90, 95, 0.85); }
      70%  { background: #e85a5f; transform: scale(1.10);
             box-shadow: 0 0 12px rgba(232, 90, 95, 0.50); }
      100% { background: transparent; transform: scale(0.85);
             box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.55); }
    }

    /* HUD pill value pulse — fires when round/score/streak change */
    .hud-pill__value.pulsing {
      animation: hud-pill-pulse 0.35s var(--ease-out-zen);
    }
    @keyframes hud-pill-pulse {
      0%   { transform: translateY(0); color: var(--accent-text); }
      40%  { transform: translateY(-2px); color: var(--accent-bright);
             text-shadow: 0 0 14px rgba(31, 95, 168, 0.45); }
      100% { transform: translateY(0); color: var(--accent-text); text-shadow: none; }
    }

    /* Calm Index tier emoji pulse — fires when the tier changes */
    .hud-calm__tier.pulsing {
      animation: hud-tier-pulse 0.6s var(--ease-out-zen);
    }
    @keyframes hud-tier-pulse {
      0%   { transform: scale(1); filter: brightness(1); }
      30%  { transform: scale(1.35); filter: brightness(1.2) drop-shadow(0 0 6px rgba(31, 95, 168, 0.45)); }
      100% { transform: scale(1); filter: brightness(1); }
    }

    /* HUD entrance — opacity-only fade-in so we don't fight the translateX
       centring on .hud-top + .hud-hint. Staggered for a calm cascade. */
    .hud-top, .hud-calm, .hud-level, .hud-hint {
      animation: hud-fade-in 0.7s var(--ease-out-zen) both;
    }
    .hud-calm  { animation-delay: 0.10s; }
    .hud-level { animation-delay: 0.15s; }
    .hud-hint  { animation-delay: 0.20s; }
    @keyframes hud-fade-in {
      from { opacity: 0; }
      to   { opacity: 1; }
    }

    /* Bottom-left Calm Index gauge */
    .hud-calm {
      position: fixed; left: 22px; bottom: 22px;
      display: flex; align-items: center; gap: 10px;
      padding: 10px 14px;
      background: var(--bg-panel);
      border: 1px solid var(--border-soft);
      border-radius: 14px;
      font-size: 12px;
      color: var(--accent-dim);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
    }
    .hud-calm__tier { font-size: 18px; line-height: 1; }
    .hud-calm__bar {
      width: 140px; height: 6px;
      background: rgba(120, 140, 160, 0.20);
      border-radius: 3px; overflow: hidden;
    }
    .hud-calm__fill {
      height: 100%; width: 0%;
      background: linear-gradient(90deg, #6fa6d4, #1f5fa8);
      transition: width 0.7s var(--ease-out-zen),
                  background 0.7s var(--ease-out-zen);
      box-shadow: 0 0 8px rgba(31, 95, 168, 0.25) inset;
    }
    .hud-calm__value {
      font-weight: 600; color: var(--accent-text);
      font-variant-numeric: tabular-nums;
      min-width: 22px; text-align: right;
    }
    .hud-calm__label {
      font-size: 9px; text-transform: uppercase;
      letter-spacing: 0.2em; color: var(--accent-faint);
    }

    /* Bottom-right level */
    .hud-level {
      position: fixed; right: 22px; bottom: 26px;
      font-size: 11px; letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--accent-faint);
    }

    /* Game-Over modal — animated entrance via .entering → final state */
    .hud-gameover {
      position: fixed; inset: 0;
      display: flex; align-items: center; justify-content: center;
      background: rgba(220, 230, 240, 0.55);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      z-index: 20;
      opacity: 1;
      transition: opacity 0.45s var(--ease-out-zen),
                  backdrop-filter 0.6s var(--ease-out-zen);
    }
    .hud-gameover[hidden] { display: none; }
    .hud-gameover.entering {
      opacity: 0;
      backdrop-filter: blur(0px);
      -webkit-backdrop-filter: blur(0px);
    }
    .hud-gameover__panel {
      background: var(--bg-panel-strong);
      border: 1px solid var(--border-strong);
      border-radius: 22px;
      padding: 36px 48px;
      min-width: 320px;
      text-align: center;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.45);
      transform: scale(1) translateY(0);
      opacity: 1;
      transition: transform 0.55s var(--ease-out-zen),
                  opacity 0.55s var(--ease-out-zen);
    }
    .hud-gameover.entering .hud-gameover__panel {
      transform: scale(0.92) translateY(8px);
      opacity: 0;
    }
    .hud-gameover__title {
      font-size: 22px; font-weight: 300;
      letter-spacing: 0.32em; text-transform: uppercase;
      color: var(--accent-text);
      margin-bottom: 22px;
    }
    .hud-gameover__stats {
      display: grid; grid-template-columns: 1fr auto;
      gap: 6px 24px; margin-bottom: 26px;
      font-size: 13px; color: var(--accent-dim);
    }
    .hud-gameover__stats dt {
      text-transform: uppercase; font-size: 10px; letter-spacing: 0.18em;
      color: var(--accent-faint); text-align: left;
    }
    .hud-gameover__stats dd {
      color: var(--accent-text); font-weight: 600;
      font-variant-numeric: tabular-nums; text-align: right;
    }
    .hud-gameover__tier {
      margin-left: 6px; color: var(--accent-faint);
      font-size: 11px; letter-spacing: 0.12em;
    }
    .hud-gameover__btn {
      padding: 10px 26px;
      background: transparent;
      border: 1px solid var(--border-strong);
      border-radius: 999px;
      color: var(--accent-text);
      font: inherit;
      font-size: 12px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      cursor: pointer;
      transition: background 0.25s var(--ease-out-zen),
                  border-color 0.25s var(--ease-out-zen);
    }
    .hud-gameover__btn:hover {
      background: rgba(31, 95, 168, 0.08);
      border-color: var(--accent-bright);
    }

    /* ──────────────────────────────────────────────────────────
       Reduced-motion: kill the ambient breath, keep static glow
       so the visual identity remains but nothing animates. Feedback
       overlays still appear (vignette/halo/score float) — they're
       essential feedback, not decoration — but they fade in/out
       quickly without scaling.
       ────────────────────────────────────────────────────────── */
    @media (prefers-reduced-motion: reduce) {
      #breath-ambient {
        animation: none;
        opacity: 0.55;
      }
      .hud-pill__value.pulsing,
      .hud-calm__tier.pulsing,
      .hud-lives__dot.losing {
        animation: none !important;
      }
      .hud-gameover__panel {
        transform: none !important;
      }
      *, *::before, *::after {
        animation-duration: 0.001ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.001ms !important;
      }
    }

    /* ╔═══════════════════════════════════════════════════════════════════╗
       ║ PHASE M3 — HUD mobile layout                                      ║
       ║                                                                   ║
       ║ Breakpoints (per docs/mobile-audit.md):                           ║
       ║   ≤768px  tablet — minor calm-bar tightening only                 ║
       ║   ≤600px  small tablet / phone landscape                          ║
       ║   ≤480px  phone portrait — main mobile rules                      ║
       ║   ≤360px  smallest phone — collapse calm bar to icon+number       ║
       ║                                                                   ║
       ║ Strategy: shrink type/padding/gaps so the centred HUD top row    ║
       ║ stays single-line; honor env(safe-area-inset-*) so notched        ║
       ║ phones don't clip pills under the status bar.                     ║
       ╚═══════════════════════════════════════════════════════════════════╝ */

    /* Tablet portrait — calm bar slightly narrower so it doesn't crowd
       the bottom-right level pill on iPad-portrait widths. */
    @media (max-width: 768px) {
      .hud-calm__bar { width: 120px; }
    }

    /* Phone landscape / small tablet — meaningful tightening starts here. */
    @media (max-width: 600px) {
      .hud-top {
        top: calc(var(--nav-h) + 12px);
        gap: 10px;
      }
      .hud-pill {
        padding: 7px 14px;
        font-size: 12px;
      }
      .hud-hint {
        top: calc(var(--nav-h) + 56px);
        font-size: 10px;
        letter-spacing: 0.26em;
      }
      .hud-lives {
        top: calc(var(--nav-h) + 84px);
        gap: 11px;
      }
      .hud-calm {
        left: max(16px, env(safe-area-inset-left, 0px));
        bottom: calc(env(safe-area-inset-bottom, 0px) + 16px);
        padding: 9px 12px;
      }
      .hud-calm__bar { width: 110px; }
      .hud-level {
        right: max(16px, env(safe-area-inset-right, 0px));
        bottom: calc(env(safe-area-inset-bottom, 0px) + 18px);
      }

      /* Game-Over panel: stop forcing 320px min-width + cap to viewport. */
      .hud-gameover__panel {
        min-width: 0;
        max-width: 92vw;
        max-height: 88vh;
        overflow-y: auto;
        padding: 28px 26px;
      }
      .hud-gameover__btn {
        min-height: 44px; /* WCAG 2.5.5 touch target */
      }
    }

    /* Phone portrait — primary mobile rules (per spec). */
    @media (max-width: 480px) {
      .hud-top {
        top: calc(var(--nav-h) + 10px);
        gap: 8px;
      }
      .hud-pill {
        padding: 6px 12px;
        font-size: 11px;
        gap: 6px;
      }
      .hud-pill__label {
        font-size: 9px;
        letter-spacing: 0.16em;
      }
      .hud-hint {
        top: calc(var(--nav-h) + 50px);
        font-size: 10px;
        letter-spacing: 0.22em;
      }
      .hud-lives {
        top: calc(var(--nav-h) + 76px);
        gap: 10px;
      }
      .hud-calm {
        padding: 8px 12px;
        gap: 8px;
        font-size: 11px;
        border-radius: 12px;
      }
      .hud-calm__tier { font-size: 16px; }
      .hud-calm__bar { width: 100px; }
      .hud-calm__label { display: none; } /* "Calm Index" wordmark redundant on phone */

      /* Bottom-right level pill duplicates the Round HUD pill (already
         aria-hidden) — drop it on phones where every pixel counts. */
      .hud-level { display: none; }

      .hud-gameover__panel {
        padding: 22px 20px;
        border-radius: 18px;
      }
      .hud-gameover__title {
        font-size: 18px;
        letter-spacing: 0.28em;
        margin-bottom: 18px;
      }
      .hud-gameover__stats {
        gap: 4px 16px;
        margin-bottom: 22px;
        font-size: 12px;
      }
      .hud-gameover__stats dt { font-size: 9px; }
      .hud-gameover__actions {
        flex-direction: column;
        align-items: stretch;
        gap: 8px;
      }
      .hud-gameover__btn {
        width: 100%;
        min-height: 48px;
        padding: 12px 20px;
        font-size: 11px;
      }
    }

    /* Smallest phones — collapse calm bar to emoji + numeric value only. */
    @media (max-width: 360px) {
      .hud-top { gap: 6px; }
      .hud-pill {
        padding: 5px 10px;
        font-size: 10px;
        letter-spacing: 0.02em;
      }
      .hud-pill__label { font-size: 8px; letter-spacing: 0.14em; }
      .hud-hint { font-size: 9px; letter-spacing: 0.18em; }
      .hud-calm__bar { display: none; }
    }

    /* ╔═══════════════════════════════════════════════════════════════════╗
       ║ PHASE 10 — App shell                                              ║
       ║                                                                   ║
       ║ Layout containers: #app-nav-host (fixed top), #app (page mount).  ║
       ║ Pages live inside .page-container > .page; the router fades        ║
       ║ .page-container in/out on every route swap.                       ║
       ╚═══════════════════════════════════════════════════════════════════╝ */

    /* Page container — host for whichever view is currently mounted.
       Cross-fades on route swap (router toggles .page-container--fading). */
    .page-container {
      position: fixed;
      inset: 0;
      z-index: 5; /* above breath ambient (2), below HUD overlay (10) */
      opacity: 1;
      transition: opacity 0.4s var(--ease-out-zen);
    }
    .page-container--fading { opacity: 0; }

    .page {
      position: absolute; inset: 0;
      display: flex; align-items: center; justify-content: center;
      padding: 0 24px;
    }
    .page--play {
      /* The play view fills its host with the canvas; no centering offsets. */
      padding: 0;
      align-items: stretch; justify-content: stretch;
    }

    /* Reusable glass card for static pages */
    .glass-card {
      background: var(--bg-panel);
      border: 1px solid var(--border-soft);
      border-radius: 22px;
      padding: 44px 48px;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      box-shadow: 0 18px 48px rgba(60, 80, 110, 0.10);
      max-width: 560px;
      width: 100%;
    }

    /* Reusable buttons */
    .zen-btn {
      display: inline-flex; align-items: center; justify-content: center;
      padding: 12px 28px;
      min-width: 132px;
      min-height: 44px; /* WCAG 2.5.5 touch target */
      background: transparent;
      border: 1px solid var(--border-strong);
      border-radius: 999px;
      color: var(--accent-text);
      font: inherit;
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      cursor: pointer;
      transition: background 0.3s var(--ease-out-zen),
                  border-color 0.3s var(--ease-out-zen),
                  color 0.3s var(--ease-out-zen),
                  transform 0.3s var(--ease-out-zen);
    }
    .zen-btn:hover {
      background: rgba(31, 95, 168, 0.06);
      border-color: var(--accent-bright);
      color: var(--accent-bright);
    }
    .zen-btn:active { transform: translateY(1px); }
    .zen-btn--primary {
      background: rgba(31, 95, 168, 0.14);
      border-color: var(--accent-bright);
      color: var(--accent-bright);
    }
    .zen-btn--primary:hover {
      background: rgba(31, 95, 168, 0.22);
    }
    .zen-btn--ghost {
      border-color: var(--border-soft);
      color: var(--accent-dim);
    }

    /* ─── Top-bar nav ───────────────────────────────────────────── */
    .app-nav {
      position: fixed; top: 0; left: 0; right: 0;
      z-index: 11;
      display: flex; align-items: center; justify-content: space-between;
      padding: 14px 28px;
      background: rgba(255, 255, 255, 0.42);
      border-bottom: 1px solid var(--border-soft);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      animation: app-nav-fade 0.5s var(--ease-out-zen);
    }
    .app-nav[hidden] { display: none; }
    @keyframes app-nav-fade { from { opacity: 0; } to { opacity: 1; } }

    .app-nav__logo {
      display: inline-flex; align-items: center; gap: 10px;
      text-decoration: none;
      color: var(--accent-text);
      font-weight: 500;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      font-size: 12px;
      min-height: 44px; /* WCAG 2.5.5 — logo is a clickable home link */
      padding: 0 4px; /* widen the tap area a touch */
    }
    .app-nav__mark {
      width: 14px; height: 14px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 30%,
        var(--ball-primary) 0%,
        var(--ball-split-l1) 60%,
        var(--ball-split-l2) 100%);
      box-shadow: 0 0 8px rgba(94, 122, 150, 0.45);
    }
    .app-nav__links {
      display: flex; gap: 8px; list-style: none;
    }
    .app-nav__links a {
      display: inline-block;
      padding: 6px 14px;
      border-radius: 999px;
      font-size: 11px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--accent-dim);
      text-decoration: none;
      transition: background 0.25s var(--ease-out-zen),
                  color 0.25s var(--ease-out-zen);
    }
    .app-nav__links a:hover { color: var(--accent-text); }
    .app-nav__links a.is-active {
      color: var(--accent-bright);
      background: rgba(31, 95, 168, 0.10);
    }
    .app-nav__user {
      font-size: 11px;
      letter-spacing: 0.16em;
      color: var(--accent-faint);
      text-transform: uppercase;
    }
    .app-nav__user-name { color: var(--accent-text); font-weight: 500; }
    .app-nav__signin {
      color: var(--accent-bright);
      text-decoration: none;
      padding: 6px 12px;
      border-radius: 999px;
      border: 1px solid var(--border-soft);
      transition: background 0.25s var(--ease-out-zen);
    }
    .app-nav__signin:hover { background: rgba(31, 95, 168, 0.08); }

    /* ─── Landing ──────────────────────────────────────────────── */
    .landing {
      display: flex; flex-direction: column; align-items: center;
      gap: 56px;
      text-align: center;
      max-width: 640px;
    }
    .landing__brand {
      display: flex; flex-direction: column; align-items: center; gap: 18px;
    }
    .landing__mark {
      position: relative;
      width: 92px; height: 92px;
      margin-bottom: 8px;
    }
    .landing__mark-orb {
      position: absolute;
      border-radius: 50%;
      box-shadow: 0 6px 28px rgba(94, 122, 150, 0.32);
      animation: landing-orb-breathe 5s ease-in-out infinite;
    }
    .landing__mark-orb--a {
      width: 60px; height: 60px;
      left: 0; top: 18px;
      background: radial-gradient(circle at 35% 30%,
        rgba(255, 255, 255, 0.85), var(--ball-primary) 70%);
      animation-delay: 0s;
    }
    .landing__mark-orb--b {
      width: 36px; height: 36px;
      right: 6px; top: 0;
      background: radial-gradient(circle at 35% 30%,
        rgba(255, 255, 255, 0.85), var(--ball-split-l1) 70%);
      animation-delay: 0.6s;
    }
    .landing__mark-orb--c {
      width: 22px; height: 22px;
      right: 28px; bottom: 4px;
      background: radial-gradient(circle at 35% 30%,
        rgba(255, 255, 255, 0.85), var(--ball-split-l2) 70%);
      animation-delay: 1.2s;
    }
    @keyframes landing-orb-breathe {
      0%, 100% { transform: scale(1);   filter: brightness(1); }
      50%      { transform: scale(1.05); filter: brightness(1.08); }
    }
    .landing__title {
      font-size: clamp(2rem, 8vw, 3.5rem); /* 32px on phone → 56px on desktop */
      font-weight: 300;
      letter-spacing: clamp(0.18em, 1vw, 0.36em);
      text-transform: uppercase;
      color: var(--accent-text);
      /* Half the letter-spacing as a margin-left so the trailing letter's
         tracking doesn't visually push the title off-center. Using clamp
         with the same input means the comp stays right at every size. */
      margin-left: clamp(0.09em, 0.5vw, 0.18em);
    }
    .landing__tagline {
      font-size: 13px;
      letter-spacing: 0.34em;
      text-transform: uppercase;
      color: var(--accent-faint);
    }
    .landing__cta {
      display: flex; flex-wrap: wrap; gap: 14px;
      justify-content: center;
    }
    .landing__hello {
      font-size: 12px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--accent-dim);
    }

    /* ─── Auth ─────────────────────────────────────────────────── */
    .auth {
      max-width: 420px;
      text-align: center;
    }
    .auth__title {
      font-size: 22px; font-weight: 300;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: var(--accent-text);
      margin-bottom: 12px;
    }
    .auth__hint {
      font-size: 12px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--accent-faint);
      margin-bottom: 26px;
    }
    .auth__form {
      display: flex; flex-direction: column; gap: 12px;
    }
    .auth__label {
      font-size: 10px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--accent-faint);
      text-align: left;
    }
    .auth__input {
      padding: 12px 16px;
      background: rgba(255, 255, 255, 0.6);
      border: 1px solid var(--border-soft);
      border-radius: 12px;
      color: var(--accent-text);
      font: inherit;
      font-size: 14px;
      transition: border-color 0.25s var(--ease-out-zen),
                  background 0.25s var(--ease-out-zen);
    }
    .auth__input:focus {
      border-color: var(--accent-bright);
      background: rgba(255, 255, 255, 0.85);
    }
    .auth__input[aria-invalid="true"] {
      border-color: rgba(220, 90, 80, 0.6);
    }
    .auth__error {
      font-size: 11px;
      color: rgba(180, 60, 60, 0.85);
      text-align: left;
      min-height: 14px;
      letter-spacing: 0.04em;
    }
    .auth .zen-btn { margin-top: 8px; align-self: stretch; }

    /* ─── Leaderboard ──────────────────────────────────────────── */
    .leaderboard { max-width: 580px; }
    .leaderboard__header { text-align: center; margin-bottom: 28px; }
    .leaderboard__header h1 {
      font-size: 22px; font-weight: 300;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: var(--accent-text);
      margin-bottom: 6px;
    }
    .leaderboard__subtitle {
      font-size: 11px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--accent-faint);
    }
    .leaderboard__list {
      list-style: none;
      display: flex; flex-direction: column;
      gap: 4px;
    }
    .leaderboard__row {
      display: grid;
      grid-template-columns: 32px 1fr auto 28px;
      align-items: center;
      gap: 12px;
      padding: 10px 16px;
      border-radius: 12px;
      /* Transparent 1px baseline so .leaderboard__row--me's solid border
         doesn't shift adjacent rows by 1px — every row reserves the same
         border box, only the color changes for the highlighted row. */
      border: 1px solid transparent;
      font-size: 13px;
      color: var(--accent-text);
      transition: background 0.25s var(--ease-out-zen);
    }
    .leaderboard__row:hover { background: rgba(255, 255, 255, 0.4); }
    .leaderboard__row--me {
      background: rgba(31, 95, 168, 0.10);
      border-color: rgba(31, 95, 168, 0.25);
    }
    .leaderboard__rank {
      font-size: 11px;
      letter-spacing: 0.12em;
      color: var(--accent-faint);
      font-variant-numeric: tabular-nums;
    }
    .leaderboard__name { font-weight: 500; }
    .leaderboard__name em {
      font-style: normal;
      font-size: 10px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--accent-bright);
      margin-left: 6px;
    }
    .leaderboard__score {
      font-weight: 600;
      font-variant-numeric: tabular-nums;
      color: var(--accent-text);
    }
    .leaderboard__tier { font-size: 18px; line-height: 1; }
    .leaderboard__empty {
      text-align: center;
      font-size: 12px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--accent-faint);
      padding: 32px 0;
    }

    /* ─── Profile ──────────────────────────────────────────────── */
    .profile { max-width: 480px; text-align: center; }
    .profile__header { margin-bottom: 28px; }
    .profile__header h1 {
      font-size: 26px; font-weight: 300;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--accent-text);
      margin-bottom: 6px;
    }
    .profile__email {
      font-size: 12px;
      color: var(--accent-faint);
      letter-spacing: 0.06em;
    }
    .profile__stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 18px;
      margin-bottom: 32px;
    }
    .profile__stat {
      padding: 14px 8px;
      border: 1px solid var(--border-soft);
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.4);
    }
    .profile__stat dt {
      font-size: 9px;
      text-transform: uppercase;
      letter-spacing: 0.22em;
      color: var(--accent-faint);
      margin-bottom: 4px;
    }
    .profile__stat dd {
      font-size: 22px;
      font-weight: 600;
      color: var(--accent-text);
      font-variant-numeric: tabular-nums;
    }
    .profile__tier {
      display: block;
      font-size: 11px;
      font-weight: 400;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--accent-faint);
      margin-top: 4px;
    }
    .profile__actions {
      display: flex; gap: 12px; flex-wrap: wrap; justify-content: center;
    }
    .profile__empty {
      font-size: 13px;
      color: var(--accent-dim);
      margin: 12px 0 24px;
      letter-spacing: 0.06em;
    }

    /* ─── Play view ────────────────────────────────────────────── */
    .play__canvas {
      position: absolute; inset: 0;
      width: 100%; height: 100%;
      z-index: 1;
    }
    .play__hud {
      position: fixed; inset: 0;
      pointer-events: none;
      z-index: 10;
      user-select: none;
    }
    .play__hud > * { pointer-events: auto; }

    /* Inline redirect notice rendered by the auth gate */
    .page-redirect {
      font-size: 13px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--accent-faint);
    }

    /* ─── Game Over panel — Phase 11 multi-button row ──────────── */
    .hud-gameover__actions {
      display: flex; flex-wrap: wrap; gap: 10px;
      justify-content: center;
    }
    .hud-gameover__btn--primary {
      background: rgba(31, 95, 168, 0.14);
      border-color: var(--accent-bright);
      color: var(--accent-bright);
    }
    .hud-gameover__btn--primary:hover {
      background: rgba(31, 95, 168, 0.22);
    }
    .hud-gameover__btn--ghost {
      border-color: var(--border-soft);
      color: var(--accent-dim);
    }

    /* Reduced-motion: kill the landing orb breathing + nav fade */
    @media (prefers-reduced-motion: reduce) {
      .landing__mark-orb,
      .app-nav { animation: none !important; }
      .page-container { transition: none !important; }
    }

    /* ╔═══════════════════════════════════════════════════════════════════╗
       ║ PHASE M4 — App shell mobile layout                                ║
       ║                                                                   ║
       ║ Replaces the original single 540px breakpoint with a cascade       ║
       ║ aligned to docs/mobile-audit.md:                                  ║
       ║   ≤768px  tablet portrait — light tightening                      ║
       ║   ≤600px  phone landscape / small tablet — main responsive shifts ║
       ║   ≤480px  phone portrait — final compaction                       ║
       ╚═══════════════════════════════════════════════════════════════════╝ */

    @media (max-width: 768px) {
      /* Tablet: trim glass-card outer padding so cards breathe vs viewport. */
      .glass-card { padding: 36px 32px; }

      /* iOS Safari auto-zooms inputs <16px; bump now and the zoom-jolt
         disappears across phones+tablets. Doesn't visibly affect desktop
         since this rule won't run there. */
      .auth__input { font-size: 16px; }

      /* Auth card slightly narrower per spec (was 420). */
      .auth { max-width: 380px; }

      /* Profile stats step down to 2-col on tablet/landscape phone. */
      .profile__stats { grid-template-columns: repeat(2, 1fr); }
    }

    @media (max-width: 600px) {
      /* Page edge padding tighter so cards aren't pinched. */
      .page { padding: 0 16px; }

      .glass-card { padding: 28px 22px; }

      /* Top-bar nav: tighten chrome. Honors safe-area-inset for notched
         phones. Logo + links stay on one row by shrinking link pills. */
      .app-nav {
        padding: 10px 16px;
        padding-top: max(10px, env(safe-area-inset-top, 0px));
        padding-left: max(16px, env(safe-area-inset-left, 0px));
        padding-right: max(16px, env(safe-area-inset-right, 0px));
        gap: 8px;
      }
      .app-nav__logo { font-size: 11px; gap: 8px; }
      .app-nav__links { gap: 4px; }
      .app-nav__links a {
        padding: 8px 10px;
        font-size: 10px;
        letter-spacing: 0.14em;
        min-height: 44px; /* WCAG: pad ensures tap area without huge visual */
        display: inline-flex; align-items: center;
      }
      .app-nav__signin {
        padding: 10px 12px;
        min-height: 44px;
        display: inline-flex; align-items: center;
      }
      .app-nav__user {
        font-size: 10px;
        max-width: 30vw;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      /* Landing: stack CTAs full-width column on phone landscape and below. */
      .landing { gap: 36px; }
      .landing__cta {
        flex-direction: column;
        align-items: stretch;
        width: 100%;
        max-width: 320px;
      }
      .landing__cta .zen-btn {
        width: 100%;
        min-height: 48px; /* primary CTA — bigger than 44px floor */
        font-size: 12px;
      }

      /* Leaderboard: table → vertical card list per spec.
         Layout:
           [rank] [name . . . . . . . ]
           [      ] [score . . . . .] [tier]                                */
      .leaderboard__list { gap: 8px; }
      .leaderboard__row {
        grid-template-columns: 36px 1fr auto;
        grid-template-areas:
          "rank name name"
          "rank score tier";
        row-gap: 4px;
        column-gap: 10px;
        padding: 12px 14px;
        background: rgba(255, 255, 255, 0.32);
        border: 1px solid var(--border-soft);
        border-radius: 14px;
        font-size: 14px;
      }
      .leaderboard__row:hover { background: rgba(255, 255, 255, 0.42); }
      .leaderboard__rank {
        grid-area: rank;
        align-self: center;
        font-size: 14px;
        font-weight: 600;
        color: var(--accent-text);
        letter-spacing: 0.04em;
      }
      .leaderboard__name { grid-area: name; }
      .leaderboard__score { grid-area: score; font-size: 13px; }
      .leaderboard__tier { grid-area: tier; align-self: end; }

      /* Headlines on the leaderboard / profile / auth cards — fluid scale. */
      .leaderboard__header h1,
      .auth__title { font-size: 18px; letter-spacing: 0.24em; }
      .profile__header h1 { font-size: 20px; letter-spacing: 0.18em; }

      /* Profile stats — keep 2-col here on tiny landscape; 1-col on ≤480. */
      .profile__stats { gap: 12px; }
    }

    @media (max-width: 480px) {
      /* Auth card edge padding tighter again. */
      .glass-card { padding: 24px 18px; }
      .page { padding: 0 12px; }

      /* App nav: drop the user wordmark to give links room.
         Keep .app-nav__signin (anonymous users still need sign-in path). */
      .app-nav__user-name { display: none; }
      .app-nav__logo-text {
        max-width: 96px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      /* Landing: shorter vertical breathing room. */
      .landing { gap: 28px; }
      .landing__mark { width: 76px; height: 76px; }
      .landing__mark-orb--a { width: 50px; height: 50px; top: 16px; }
      .landing__mark-orb--b { width: 30px; height: 30px; }
      .landing__mark-orb--c { width: 18px; height: 18px; }
      .landing__tagline { font-size: 11px; letter-spacing: 0.24em; }

      /* Profile stats finally collapse to single column per spec. */
      .profile__stats { grid-template-columns: 1fr; }

      /* Leaderboard rows tighter on tiny phones. */
      .leaderboard__row {
        grid-template-columns: 30px 1fr auto;
        padding: 10px 12px;
        font-size: 13px;
      }
      .leaderboard__rank { font-size: 13px; }
    }

    /* ╔═══════════════════════════════════════════════════════════════════╗
       ║ PHASE M3/M4 — Cross-cutting mobile fixes (folded in from QA review)║
       ║                                                                   ║
       ║ - --nav-h recomputed per-breakpoint with safe-area awareness so    ║
       ║   HUD pills and page padding never collide with the top nav.     ║
       ║ - .page-container becomes the scroll context for non-play pages   ║
       ║   (auth/leaderboard/profile/landing) so tall content like a 30-row║
       ║   leaderboard doesn't clip on a 320×568 phone.                    ║
       ║ - 100dvh on mobile so iOS Safari's dynamic chrome doesn't make    ║
       ║   100% jump as the toolbar shows/hides.                           ║
       ║ - (hover: none) reset so :hover states don't get stuck on tap on  ║
       ║   touch devices.                                                  ║
       ║ - (orientation: landscape) and (max-height: 480px) — phone-       ║
       ║   landscape rules where the constraint is height, not width.     ║
       ╚═══════════════════════════════════════════════════════════════════╝ */

    @media (max-width: 768px) {
      /* Use dynamic viewport units so iOS Safari toolbar collapse/expand
         doesn't cause a height jump. dvh is well-supported in Safari 16+,
         Chrome 108+, Firefox 101+. height:100% remains the fallback. */
      html, body, #root, #app { height: 100dvh; }

      /* Page-container scroll override: by default `.page-container` is
         `position: fixed; inset: 0; overflow: hidden` which prevents
         vertical scroll on small phones where a card might be taller than
         the viewport. Allow scroll on every route EXCEPT play (which must
         stay locked so the canvas fills the viewport). The :has() selector
         is supported in all relevant browsers (Safari 15.4+, Chrome 105+). */
      .page-container { overflow-y: auto; -webkit-overflow-scrolling: touch; }
      .page-container:has(.page--play) { overflow: hidden; }

      /* Recompute --nav-h to include safe-area-inset-top so HUD pills
         clear the notch + nav padding together. */
      :root { --nav-h: calc(env(safe-area-inset-top, 0px) + 60px); }
    }

    @media (max-width: 480px) {
      :root { --nav-h: calc(env(safe-area-inset-top, 0px) + 56px); }
    }

    /* Phone landscape — height-budget rules, not width. The bottom-anchored
       calm bar + level pill have very little vertical room here, and the
       game-over modal must compress aggressively or buttons disappear
       below the fold. */
    @media (orientation: landscape) and (max-height: 480px) {
      .hud-top {
        top: calc(env(safe-area-inset-top, 0px) + 8px);
      }
      .hud-hint {
        top: calc(env(safe-area-inset-top, 0px) + 38px);
        font-size: 9px;
      }
      .hud-lives {
        top: calc(env(safe-area-inset-top, 0px) + 60px);
        gap: 9px;
      }
      .hud-calm {
        padding: 6px 10px;
        bottom: calc(env(safe-area-inset-bottom, 0px) + 8px);
        left: max(12px, env(safe-area-inset-left, 0px));
      }
      .hud-calm__bar { width: 80px; }
      .hud-calm__label { display: none; }
      .hud-level { display: none; }

      .hud-gameover__panel {
        max-height: 92vh;
        padding: 18px 22px;
      }
      .hud-gameover__title {
        margin-bottom: 12px;
        font-size: 16px;
      }
      .hud-gameover__stats {
        margin-bottom: 14px;
        gap: 2px 16px;
      }
      .hud-gameover__actions {
        flex-direction: row; /* override ≤480 column-stack — vertical room is the constraint */
        gap: 8px;
      }
      .hud-gameover__btn {
        width: auto;
        min-height: 40px;
        padding: 8px 18px;
      }
    }

    /* Coarse-pointer reset — touch devices should not retain :hover state
       after a tap. Re-declare the original (non-hover) values so the rule
       wins on specificity without `!important`. Wrapping the source rules
       in `@media (hover: hover)` would be cleaner but means touching 8
       scattered selectors; this single block keeps the diff focused and
       is trivial to extend when new hover rules are added. */
    @media (hover: none) {
      .zen-btn:hover {
        background: transparent;
        border-color: var(--border-strong);
        color: var(--accent-text);
        transform: none;
      }
      .zen-btn--primary:hover {
        background: rgba(31, 95, 168, 0.14);
        border-color: var(--accent-bright);
        color: var(--accent-bright);
      }
      .app-nav__links a:hover { color: var(--accent-dim); }
      .app-nav__signin:hover { background: transparent; }
      .leaderboard__row:hover { background: transparent; }
      .hud-gameover__btn:hover {
        background: transparent;
        border-color: var(--border-strong);
      }
      .hud-gameover__btn--primary:hover {
        background: rgba(31, 95, 168, 0.14);
        border-color: var(--accent-bright);
      }
    }
  </style>
</head>
<body>
  <!-- Ambient zen breath layer — pure CSS, runs forever, no JS coupling.
       Stays global across all routes per spec. -->
  <div id="breath-ambient" aria-hidden="true"></div>

  <!-- App page-mount target. main.js boots the router which swaps views
       inside this container with a 0.4s opacity fade. -->
  <div id="app" class="page-container"></div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
